<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Darkwing Duck (NES) — Уровень «Мост» &amp; Quackerjack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e1a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
    }
    .shell {
      width: 100%;
      max-width: 780px;
      background: #14192d;
      border: 2px solid #312e81;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #fde047;
      letter-spacing: 0.4px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #334155; }
    button.primary { background: #6d28d9; border-color: #8b5cf6; }
    button.primary:hover { background: #7c3aed; }
    .screen-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 256 / 240;
      background: #000;
      border: 2px solid #0f172a;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 38px);
      gap: 3px;
    }
    .dpad button, .ab-pad button {
      padding: 0;
      font-size: 14px;
      font-weight: 700;
      touch-action: none;
    }
    .dpad .empty { visibility: hidden; }
    .ab-pad {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ab-pad button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
    }
    .btn-a { background: #be123c; border-color: #f43f5e; }
    .btn-b { background: #b45309; border-color: #f59e0b; }
    .btn-w { width: 46px !important; height: 36px !important; border-radius: 8px !important; font-size: 11px !important; }
    .legend {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
    .legend code {
      background: #0f172a;
      color: #fde047;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="title">DARKWING DUCK (NES) — BRIDGE STAGE</div>
      <div class="actions">
        <button id="btn-start" class="primary">▶ Старт / Рестарт</button>
        <button id="btn-boss">⚡ Арена босса</button>
        <button id="btn-mute">🔊 Звук: ВКЛ</button>
        <button id="btn-pause">⏸ Пауза</button>
      </div>
    </div>

    <div class="screen-wrap">
      <canvas id="gameCanvas" width="256" height="240"></canvas>
    </div>

    <div class="controls-row">
      <div class="dpad">
        <div class="empty"></div>
        <button data-key="up">▲</button>
        <div class="empty"></div>
        <button data-key="left">◀</button>
        <div class="empty"></div>
        <button data-key="right">▶</button>
        <div class="empty"></div>
        <button data-key="down">▼</button>
        <div class="empty"></div>
      </div>
      <div class="ab-pad">
        <button id="btn-weapon" class="btn-w">ГАЗ</button>
        <button data-key="shoot" class="btn-b">B</button>
        <button data-key="jump" class="btn-a">A</button>
      </div>
    </div>

    <div class="legend">
      Управление: <code>←/→</code> или <code>A/D</code> — бег ·
      <code>↑/W</code> — защита плащом / зацеп за крюк и край платформы ·
      <code>↓/S</code> — присесть (можно стрелять) · <code>↓ + Прыжок</code> — спрыгнуть с балки ·
      <code>Z / Space</code> — прыжок · <code>X / J</code> — выстрел · <code>C / Q</code> — смена газа (Normal / Thunder / Heavy / Arrow)
    </div>
  </div>

  <script src="src/sprites.js"></script>
  <script src="src/level.js"></script>
  <script src="src/sfx_data.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/boss.js"></script>
  <script src="src/game.js"></script>
  <script>
    window.onload = function () {
      const paths = {
        bridge: 'assets/bridge.png',
        dw: 'assets/dw.png',
        qj: 'assets/qj.png',
        enemies: 'assets/enemies.png',
        items: 'assets/items.png'
      };
      const assets = {};
      let loaded = 0;
      const keys = Object.keys(paths);

      function onAssetLoad() {
        loaded++;
        if (loaded === keys.length) {
          initGame();
        }
      }

      for (const k of keys) {
        const img = new Image();
        img.onload = onAssetLoad;
        img.onerror = onAssetLoad;
        img.src = paths[k];
        assets[k] = img;
      }

      function initGame() {
        const canvas = document.getElementById('gameCanvas');
        const game = new DarkwingBridgeGame(canvas, assets);

        document.getElementById('btn-start').addEventListener('click', () => game.startNewGame());
        document.getElementById('btn-boss').addEventListener('click', async () => {
          await game.audio.init();
          if (game.state === 'title' || game.state === 'gameover' || game.state === 'victory') {
            game.player = new Player(32, 185);
          }
          game.state = 'playing';
          game.enterZone('zone3', 32, 185);
        });
        document.getElementById('btn-mute').addEventListener('click', () => game.toggleMute());
        document.getElementById('btn-pause').addEventListener('click', () => {
          if (game.state === 'playing') game.state = 'paused';
          else if (game.state === 'paused') game.state = 'playing';
        });
        document.getElementById('btn-weapon').addEventListener('click', () => {
          if (game.state === 'playing') game.player.cycleWeapon();
        });

        document.querySelectorAll('[data-key]').forEach((btn) => {
          const k = btn.getAttribute('data-key');
          const down = (e) => { e.preventDefault(); game.setTouchKey(k, true); };
          const up = (e) => { e.preventDefault(); game.setTouchKey(k, false); };
          btn.addEventListener('mousedown', down);
          btn.addEventListener('mouseup', up);
          btn.addEventListener('mouseleave', up);
          btn.addEventListener('touchstart', down, { passive: false });
          btn.addEventListener('touchend', up, { passive: false });
        });
      }
    };
  </script>
</body>
</html>
